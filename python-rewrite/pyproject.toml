[project]
name = "recordandgrow-py"
version = "0.9.9"
description = "个人上下文 Agent：业务数据、向量、关键词检索都在同一个 PostgreSQL 实例里。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "tiktoken>=0.8",
    "tzdata>=2024.1",
    "jieba>=0.42",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.7",
    "mypy>=1.13",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 中文长句与 Prompt 模板天然超长；FastAPI 的 Depends/Query 默认参数是惯用法
ignore = ["E501", "B008", "UP042", "UP046"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
