components:
  schemas:
    Body_upload_api_documents_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_api_documents_post
    ChatAskRequest:
      properties:
        question:
          type: string
          minLength: 1
          title: Question
        conversationId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Conversationid
        maxTokens:
          anyOf:
          - type: integer
            maximum: 4096.0
            minimum: 64.0
          - type: 'null'
          title: Maxtokens
        temperature:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.0
          - type: 'null'
          title: Temperature
      type: object
      required:
      - question
      title: ChatAskRequest
    ConversationCreateRequest:
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      type: object
      title: ConversationCreateRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MemoryConfirmRequest:
      properties:
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
        type:
          anyOf:
          - type: string
            enum:
            - FACT
            - INFERRED
          - type: 'null'
          title: Type
      type: object
      title: MemoryConfirmRequest
    MemoryCreateRequest:
      properties:
        content:
          type: string
          title: Content
      type: object
      required:
      - content
      title: MemoryCreateRequest
    TimelineEntryRequest:
      properties:
        content:
          type: string
          minLength: 1
          title: Content
        startTime:
          type: string
          format: date-time
          title: Starttime
        endTime:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Endtime
      type: object
      required:
      - content
      - startTime
      title: TimelineEntryRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
