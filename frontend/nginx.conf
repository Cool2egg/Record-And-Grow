# 同源部署：静态文件走 nginx，/api 与 /mcp 反代到宿主机上的 Spring Boot。
# 后端不在 compose 里（开发时用 mvn spring-boot:run），所以这里用
# host.docker.internal；compose 里已为 Linux 加了 host-gateway。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 multipart 上限（12MB）保持一致
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SSE 不能经过会缓冲响应的代理
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # MCP 客户端（stateless JSON-RPC）走同一后端
    location = /mcp {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # React Router：前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
