services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recordandgrow-postgres
    environment:
      POSTGRES_DB: recordandgrow
      POSTGRES_USER: recordandgrow
      POSTGRES_PASSWORD: recordandgrow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本：首次启动时自动创建 pgvector 扩展
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recordandgrow -d recordandgrow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 数据库版本迁移：应用启动不跑 Flyway（保留「无 DB 可启动」），改由本服务在 compose 启动时执行
  flyway:
    image: flyway/flyway:11.15.0
    container_name: recordandgrow-flyway
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 迁移脚本：与测试共用同一份建表来源
      - ./src/main/resources/db/migration:/flyway/sql
    command:
      - -url=jdbc:postgresql://postgres:5432/recordandgrow
      - -user=recordandgrow
      - -password=recordandgrow
      - migrate

  # RocketMQ（可选）：本机已装 5.3.2 发行版时不必起这两个容器，
  # 直接按 docs/dev-environment.md 第 5 节启动 namesrv + broker 即可。
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: recordandgrow-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      # 默认 JVM 配额很大，不限制会吃掉本机内存
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: recordandgrow-rocketmq-broker
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      # brokerIP1 必须配，否则客户端拿到容器内网 IP，连不上
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"

  # 关键词通道（模块九）：单节点 ES，关闭安全认证，只给本机用。
  # 镜像默认装 IK 分词插件；装不上时把 docker/es/Dockerfile 换成 analysis-smartcn，
  # 同时把 application.yml 的 keyword.analyzer 改成 smartcn。
  elasticsearch:
    build:
      context: ./docker/es
    container_name: recordandgrow-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 可选知识图谱存储（默认不用）：docker compose --profile graph up -d neo4j
  # 启动后：GRAPH_STORE=neo4j NEO4J_PASSWORD=recordandgrow
  neo4j:
    image: neo4j:5.26-community
    container_name: recordandgrow-neo4j
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/recordandgrow
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  es_data:
  neo4j_data:
