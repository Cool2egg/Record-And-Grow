<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180">

  <!-- Left accent line -->
  <line x1="32" y1="26" x2="32" y2="154" stroke="#CDD1C3" stroke-width="2"/>

  <!-- Three marks: pending / inferred / fact -->
  <circle cx="32" cy="144" r="7" fill="none" stroke="#6E7568" stroke-width="2" stroke-dasharray="3.5 2.8"/>
  <circle cx="32" cy="90"  r="7" fill="none" stroke="#54663D" stroke-width="2"/>
  <circle cx="32" cy="36"  r="7" fill="#2C6B67"/>

  <!-- Line 1: Record — R in accent -->
  <text x="56" y="100"
        font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif"
        font-size="68" font-weight="800" letter-spacing="-1">
    <tspan fill="#2C6B67">R</tspan><tspan fill="#1C231F">ecord</tspan>
  </text>

  <!-- Line 2: And (A in accent, slightly larger than "nd") + wide gap + Grow (G in accent) -->
  <text x="58" y="152"
        font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif"
        font-size="40" font-weight="300" letter-spacing="0">
    <tspan fill="#2C6B67" font-size="44" font-weight="600">A</tspan><tspan fill="#6E7568">nd</tspan>
  </text>
  <text x="182" y="152"
        font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif"
        font-size="40" font-weight="600" letter-spacing="0">
    <tspan fill="#2C6B67" font-size="44">G</tspan><tspan fill="#54663D">row</tspan>
  </text>

</svg>
