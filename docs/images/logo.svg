<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">

  <!-- Left accent line -->
  <line x1="32" y1="26" x2="32" y2="154" stroke="#CDD1C3" stroke-width="2"/>

  <!-- Three marks: pending / inferred / fact -->
  <circle cx="32" cy="144" r="7" fill="none" stroke="#6E7568" stroke-width="2" stroke-dasharray="3.5 2.8"/>
  <circle cx="32" cy="90"  r="7" fill="none" stroke="#54663D" stroke-width="2"/>
  <circle cx="32" cy="36"  r="7" fill="#2C6B67"/>

  <!-- Line 1: R highlighted pill + ecord -->
  <!-- R background pill -->
  <rect x="53" y="30" width="48" height="68" rx="6" fill="#2C6B67"/>
  <text x="56" y="98"
        font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif"
        font-size="72" font-weight="800" letter-spacing="-1">
    <tspan fill="#EFF0E9">R</tspan><tspan fill="#1C231F">ecord</tspan>
  </text>

  <!-- Line 2: A pill + nd + gap + G pill + row -->
  <!-- A background pill -->
  <rect x="57" y="112" width="34" height="50" rx="5" fill="#2C6B67"/>
  <text x="58" y="155"
        font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif"
        font-size="42" font-weight="300">
    <tspan fill="#EFF0E9" font-weight="700">A</tspan><tspan fill="#6E7568">nd</tspan>
  </text>

  <!-- G background pill -->
  <rect x="200" y="112" width="34" height="50" rx="5" fill="#2C6B67"/>
  <text x="200" y="155"
        font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif"
        font-size="42" font-weight="600">
    <tspan fill="#EFF0E9" font-weight="700">G</tspan><tspan fill="#54663D">row</tspan>
  </text>

</svg>
