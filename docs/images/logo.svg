<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 90" width="560" height="90">

  <!-- Left accent line with three marks -->
  <line x1="26" y1="14" x2="26" y2="76" stroke="#CDD1C3" stroke-width="1.5"/>
  <circle cx="26" cy="68" r="5" fill="none" stroke="#6E7568" stroke-width="1.5" stroke-dasharray="3 2.2"/>
  <circle cx="26" cy="45" r="5" fill="none" stroke="#54663D" stroke-width="1.5"/>
  <circle cx="26" cy="22" r="5" fill="#2C6B67"/>

  <!-- Single line: RecordAndGrow
       RAG in accent teal, slightly heavier; rest in lighter weights for contrast -->
  <text x="48" y="60"
        font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif"
        font-size="52" letter-spacing="2">
    <tspan fill="#2C6B67" font-weight="600">R</tspan><tspan fill="#1C231F" font-weight="300">ecord</tspan><tspan fill="#2C6B67" font-weight="600">A</tspan><tspan fill="#6E7568" font-weight="300">nd</tspan><tspan fill="#2C6B67" font-weight="600">G</tspan><tspan fill="#54663D" font-weight="300">row</tspan>
  </text>

</svg>
