server:
  port: 8080

spring:
  application:
    name: record-and-grow
  servlet:
    multipart:
      # 比业务上限（recordandgrow.document.max-file-size=10MB）略大，
      # 让超出 10MB 但没到 12MB 的文件由业务层返回带说明的 413
      max-file-size: 12MB
      max-request-size: 13MB
  datasource:
    url: jdbc:postgresql://localhost:5432/recordandgrow
    username: recordandgrow
    password: recordandgrow
    driver-class-name: org.postgresql.Driver
    hikari:
      # 数据库未启动时应用也能启动，由 /api/health 负责真实探活
      initialization-fail-timeout: 0
      # 探活超时 5 秒，避免数据库不可用时健康检查长时间阻塞
      connection-timeout: 5000
      maximum-pool-size: 5
  # Flyway 迁移由 docker-compose 的 flyway 服务执行，应用启动时不跑，
  # 保留「数据库未启动时应用也能启动」；数据库集成测试里用程序化迁移建表。
  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

logging:
  level:
    com.recordandgrow: debug

recordandgrow:
  ai:
    chat:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-flash}
      fallback-model: ${DEEPSEEK_FALLBACK_MODEL:deepseek-v4-pro}
      fallback-enabled: true
      thinking: disabled
      connect-timeout: 5s
      idle-timeout: 30s
      first-token-timeout: 60s
      total-timeout: 180s
      max-attempts: 2
      default-max-tokens: 2048
    embedding:
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      model: text-embedding-v4
      dimensions: 1024
      batch-size: 10
      connect-timeout: 5s
      timeout: 30s
      max-attempts: 2
  chat:
    timezone: Asia/Shanghai
    default-window-days: 30
    max-window-days: 365
    max-entries: 40
    max-entry-chars: 500
    min-entry-chars: 300
    max-context-chars: 8000
    max-records-chars: 6000
    max-question-chars: 2000
    answer-max-tokens: 1024
    max-answer-tokens: 4096
    temperature: 0.3
    # 模块六：文档检索。关掉等价于「不查文档」（documentSearched=false）。
    documents:
      enabled: true
      top-k: 8
      scan-limit: 24
      similarity-threshold: 0.25
      max-per-document: 2
      max-block-chars: 300
      max-chars: 2000
      # 查询向量化按次覆盖 ai.embedding 的 30s / 2 次；首包预算比重试值钱
      query-timeout: 8s
      query-max-attempts: 1
  # 模块九：精排 + 证据闸门。关闭时融合结果保持 RRF 顺序。
  # 需要 DASHSCOPE_API_KEY；调用失败只保留原序，不影响主链路。
  rerank:
    enabled: ${RERANK_ENABLED:false}
    base-url: ${RERANK_BASE_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${RERANK_MODEL:gte-rerank-v2}
    connect-timeout: 2s
    timeout: 1500ms
    # 整批最高精排分低于它 → 整批丢弃；换模型必须重新校准
    min-score: 0.2
  # 模块九：文档侧融合（向量 + 关键词）。关闭时原样走向量单路，与模块六一致。
  fusion:
    enabled: ${FUSION_ENABLED:false}
    # 候选池只有 20–40 条，用 20 而不是经典 60，否则名次差异被抹平
    rrf-k: 20
    candidate-limit: 20
  # 模块九：关键词通道（Elasticsearch）。默认关闭，关闭时不创建任何 ES Bean。
  keyword:
    enabled: ${KEYWORD_ENABLED:false}
    url: ${ELASTICSEARCH_URL:http://localhost:9200}
    index-name: recordandgrow-chunk
    connect-timeout: 2s
    timeout: 3s
    top-k: 20
    # 装了 IK 用 ik_max_word；没装可临时降为 standard 保证能跑起来
    analyzer: ${KEYWORD_ANALYZER:ik_max_word}
    search-analyzer: ${KEYWORD_SEARCH_ANALYZER:ik_smart}
  # 模块八：意图路由。默认关闭——关闭时不做分类，行为与模块六完全一致（两路都查）。
  # 打开后每次提问多一次小模型调用，分类失败/超时一律回退 BOTH。
  routing:
    enabled: ${ROUTING_ENABLED:false}
    timeout: 1500ms
    max-question-chars: 500
  # 模块十二：MCP Server。把只读能力暴露给外部 MCP 客户端，路径 /mcp。
  mcp:
    enabled: ${MCP_ENABLED:true}
    endpoint: /mcp
    server-name: recordandgrow
    server-version: 0.9.0
  # 模块十二：Skills。启动时扫描目录，命中触发词时注入回答 Prompt。
  skills:
    enabled: ${SKILLS_ENABLED:true}
    dir: ${SKILLS_DIR:./skills}
    max-skills: 2
  # 模块十一：AgentScope 编排。enabled 只表示允许，没配 DEEPSEEK_API_KEY 时自动回落模块四链路。
  agent:
    enabled: ${AGENT_ENABLED:true}
    research-max-iters: 4
    research-timeout: 45s
    answer-timeout: 120s
    max-evidence-chars: 7000
    max-evidence-items: 60
    memory-tools: true
    graph-tools: true
    propose-memory: true
    max-research-notes-chars: 600
  # 模块七：知识图谱。默认 Postgres；neo4j/lightrag 失败自动回落，启动期不连接外部存储。
  graph:
    enabled: ${GRAPH_ENABLED:true}
    store: ${GRAPH_STORE:postgres}
    search-limit: 5
    max-triples-per-document: 40
    extraction-max-chars: 6000
    extraction-timeout: 30s
    reindex-batch: 10
    neo4j:
      url: ${NEO4J_URL:http://localhost:7474}
      database: ${NEO4J_DATABASE:neo4j}
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}
      timeout: 3s
    lightrag:
      url: ${LIGHTRAG_URL:http://localhost:9621}
      query-path: ${LIGHTRAG_QUERY_PATH:/query}
      insert-path: ${LIGHTRAG_INSERT_PATH:/documents/text}
      mode: ${LIGHTRAG_MODE:hybrid}
      api-key: ${LIGHTRAG_API_KEY:}
      timeout: 5s
      max-response-chars: 800
  # 模块十：会话记忆 + 长期记忆三态。
  memory:
    enabled: ${MEMORY_ENABLED:true}
    history-max-messages: 12
    history-max-chars: 4000
    summary-threshold: 20
    summary-keep: 6
    summary-max-chars: 800
    extraction-enabled: ${MEMORY_EXTRACTION_ENABLED:true}
    extraction-max-candidates: 2
    pending-max: 50
    search-limit: 5
    async-timeout: 20s
  document:
    storage-dir: ./data/documents
    max-file-size: 10MB
    allowed-extensions: pdf,md,markdown,txt
    max-chars: 2000000
    parse-timeout: 60s
    queue:
      # local：直接调 service，无 broker 也能跑；rocketmq：走真实 MQ
      mode: ${DOCUMENT_QUEUE_MODE:local}
      namesrv: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
      parse-topic: doc-ingest-parse
      embed-topic: doc-ingest-embed
      producer-group: recordandgrow-doc-producer
      consumer-group-prefix: recordandgrow-doc
      max-reconsume-times: 3
      send-timeout: 3s
    chunk:
      max-tokens: 400
      overlap-tokens: 60
      min-tokens: 20
      max-chunks: 2000
      tokenizer: cl100k
    reconcile:
      enabled: true
      interval: 5m
      stale-after: 10m
      max-retries: 3
