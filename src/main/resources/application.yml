server:
  port: 8080

spring:
  application:
    name: record-and-grow
  servlet:
    multipart:
      # 比业务上限（recordandgrow.document.max-file-size=10MB）略大，
      # 让超出 10MB 但没到 12MB 的文件由业务层返回带说明的 413
      max-file-size: 12MB
      max-request-size: 13MB
  datasource:
    url: jdbc:postgresql://localhost:5432/recordandgrow
    username: recordandgrow
    password: recordandgrow
    driver-class-name: org.postgresql.Driver
    hikari:
      # 数据库未启动时应用也能启动，由 /api/health 负责真实探活
      initialization-fail-timeout: 0
      # 探活超时 5 秒，避免数据库不可用时健康检查长时间阻塞
      connection-timeout: 5000
      maximum-pool-size: 5
  # Flyway 迁移由 docker-compose 的 flyway 服务执行，应用启动时不跑，
  # 保留「数据库未启动时应用也能启动」；数据库集成测试里用程序化迁移建表。
  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

logging:
  level:
    com.recordandgrow: debug

recordandgrow:
  ai:
    chat:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-flash}
      fallback-model: ${DEEPSEEK_FALLBACK_MODEL:deepseek-v4-pro}
      fallback-enabled: true
      thinking: disabled
      connect-timeout: 5s
      idle-timeout: 30s
      first-token-timeout: 60s
      total-timeout: 180s
      max-attempts: 2
      default-max-tokens: 2048
    embedding:
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      model: text-embedding-v4
      dimensions: 1024
      batch-size: 10
      connect-timeout: 5s
      timeout: 30s
      max-attempts: 2
  chat:
    timezone: Asia/Shanghai
    default-window-days: 30
    max-window-days: 365
    max-entries: 40
    max-entry-chars: 500
    min-entry-chars: 300
    max-context-chars: 8000
    max-records-chars: 6000
    max-question-chars: 2000
    answer-max-tokens: 1024
    max-answer-tokens: 4096
    temperature: 0.3
  document:
    storage-dir: ./data/documents
    max-file-size: 10MB
    allowed-extensions: pdf,md,markdown,txt
    max-chars: 2000000
    parse-timeout: 60s
    queue:
      # local：直接调 service，无 broker 也能跑；rocketmq：走真实 MQ
      mode: ${DOCUMENT_QUEUE_MODE:local}
      namesrv: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
      parse-topic: doc-ingest-parse
      embed-topic: doc-ingest-embed
      producer-group: recordandgrow-doc-producer
      consumer-group-prefix: recordandgrow-doc
      max-reconsume-times: 3
      send-timeout: 3s
    chunk:
      max-tokens: 400
      overlap-tokens: 60
      min-tokens: 20
      max-chunks: 2000
      tokenizer: cl100k
    reconcile:
      enabled: true
      interval: 5m
      stale-after: 10m
      max-retries: 3
