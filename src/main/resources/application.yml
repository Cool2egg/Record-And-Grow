server:
  port: 8080

spring:
  application:
    name: record-and-grow
  datasource:
    url: jdbc:postgresql://localhost:5432/recordandgrow
    username: recordandgrow
    password: recordandgrow
    driver-class-name: org.postgresql.Driver
    hikari:
      # 数据库未启动时应用也能启动，由 /api/health 负责真实探活
      initialization-fail-timeout: 0
      # 探活超时 5 秒，避免数据库不可用时健康检查长时间阻塞
      connection-timeout: 5000
      maximum-pool-size: 5
  # Flyway 迁移由 docker-compose 的 flyway 服务执行，应用启动时不跑，
  # 保留「数据库未启动时应用也能启动」；数据库集成测试里用程序化迁移建表。
  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

logging:
  level:
    com.recordandgrow: debug

recordandgrow:
  ai:
    chat:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-flash}
      fallback-model: ${DEEPSEEK_FALLBACK_MODEL:deepseek-v4-pro}
      fallback-enabled: true
      thinking: disabled
      connect-timeout: 5s
      idle-timeout: 30s
      first-token-timeout: 60s
      total-timeout: 180s
      max-attempts: 2
      default-max-tokens: 2048
    embedding:
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      model: text-embedding-v4
      dimensions: 1024
      batch-size: 10
      connect-timeout: 5s
      timeout: 30s
      max-attempts: 2
